<!doctype html><html><head><meta charset="utf-8"></head><body><main id="main" class="flex-shrink-0" role="main">
    <div class="container">
                    <nav aria-label="breadcrumb"><ol id="w5" class="breadcrumb"><li class="breadcrumb-item"><a href="/">Главная</a></li>
<li class="breadcrumb-item active" aria-current="page">Вход</li>
</ol></nav>                                    
<div class="site-login">
    <h1>Вход</h1>    

    <div class="row">
        <div class="col-lg-5">

            <form id="login-form" action="/site/login" method="post">
<input type="hidden" name="_csrf" value="fixture-csrf-placeholder">
            <div class="mb-3 field-loginform-username required">
<label class="col-lg-1 col-form-label mr-lg-3" for="loginform-username">Логин</label>
<input type="text" id="loginform-username" class="col-lg-3 form-control" name="LoginForm[username]" autofocus aria-required="true">
<div class="col-lg-7 invalid-feedback"></div>
</div>
            <div class="mb-3 field-loginform-password required">
<label class="col-lg-1 col-form-label mr-lg-3" for="loginform-password">Пароль</label>
<input type="password" id="loginform-password" class="col-lg-3 form-control" name="LoginForm[password]" value="" aria-required="true">
<div class="col-lg-7 invalid-feedback"></div>
</div>
            <div class="mb-3 field-loginform-rememberme">
<div class="custom-control custom-checkbox"><input type="hidden" name="LoginForm[rememberMe]" value="0"><input type="checkbox" id="loginform-rememberme" class="form-check-input" name="LoginForm[rememberMe]" value="1" checked> <label class="form-check-label" for="loginform-rememberme">Запомнить меня</label></div>
<div class="col-lg-8"><div class="col-lg-7 invalid-feedback"></div></div>
</div>
            <div class="form-group">
                <div>
                    <button type="submit" class="btn btn-light border border-2 border-secondary" name="login-button">Вход</button>                    
                    <a class="btn btn-light border border-2 border-secondary" href="/user/restore">Забыли пароль?</a>                                        
                    
                    <a class="btn btn-light border border-2 border-secondary" href="/site/reg">Регистрация</a>                </div>
            </div>

            </form>           

        </div>
    </div>
</div>
    </div>
</main></body></html>
